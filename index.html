<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日本語 N4 模擬測驗</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Zen Maru Gothic', sans-serif;
            background-color: #fff9f9;
            color: #5c5470;
        }
        ruby {
            ruby-align: center;
        }
        rt {
            font-size: 0.65em;
            color: #9ca3af;
        }
        .macaron-bg {
            background-image: radial-gradient(#ffdac1 2px, transparent 2px), radial-gradient(#e2f0cb 2px, transparent 2px);
            background-position: 0 0, 20px 20px;
            background-size: 40px 40px;
            background-color: #fff9f9;
        }
        .macaron-card {
            background: #ffffff;
            border-radius: 30px;
            box-shadow: 0 15px 35px -5px rgba(255, 183, 178, 0.25);
            border: 4px solid #fff0f5;
        }
        .macaron-btn {
            background: linear-gradient(135deg, #ffb7b2, #ffdac1);
            color: #fff;
            box-shadow: 0 6px 15px rgba(255, 183, 178, 0.4);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .macaron-btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 8px 20px rgba(255, 183, 178, 0.6);
        }
        .macaron-btn-alt {
            background: linear-gradient(135deg, #b5ead7, #e2f0cb);
            color: #5c5470;
            box-shadow: 0 6px 15px rgba(181, 234, 215, 0.4);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .macaron-btn-alt:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 8px 20px rgba(181, 234, 215, 0.6);
        }
        .option-btn {
            border: 3px solid #f8edeb;
            border-radius: 20px;
            transition: all 0.2s ease;
        }
        .option-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            border-color: #ffdac1;
            background-color: #fffaf0;
            box-shadow: 0 4px 10px rgba(255, 218, 193, 0.2);
        }
        .option-btn.correct {
            background-color: #e2f0cb !important;
            border-color: #b5ead7 !important;
            color: #4a7c59 !important;
        }
        .option-btn.wrong {
            background-color: #ffb7b2 !important;
            border-color: #ff9aa2 !important;
            color: #c9184a !important;
        }
        .explanation-box {
            background-color: #f0f8ff;
            border-left: 6px solid #b5ead7;
            border-radius: 0 20px 20px 0;
            animation: slideDown 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-15px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .progress-fill {
            transition: width 0.4s ease;
            background: linear-gradient(90deg, #ffb7b2, #ffdac1, #e2f0cb, #b5ead7);
            background-size: 300% 100%;
            animation: gradientMove 3s ease infinite;
        }
        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
    </style>
</head>
<body class="macaron-bg min-h-screen flex items-center justify-center p-4">

    <div class="max-w-3xl w-full macaron-card overflow-hidden relative">
        
        <!-- Start Screen -->
        <div id="start-screen" class="p-10 text-center flex flex-col items-center justify-center min-h-[450px]">
            <div class="w-24 h-24 bg-[#fff0f5] text-[#ff9aa2] rounded-full flex items-center justify-center text-5xl mb-6 shadow-sm border-4 border-white">
                🍰
            </div>
            <h1 class="text-3xl font-bold text-[#6d6875] mb-4 tracking-wider">日本語 N4 模擬測驗</h1>
            <p class="text-[#8d8799] mb-8 max-w-md font-medium text-lg leading-relaxed">
                全 30 題綜合測驗 🍡<br>
                準備好挑戰你的日語實力了嗎？<br>
                答題後會有詳細的拼音解答喔！
            </p>
            <button onclick="startQuiz()" class="macaron-btn font-bold py-4 px-12 rounded-full text-lg tracking-widest">
                開始測驗
            </button>
        </div>

        <!-- Quiz Screen -->
        <div id="quiz-screen" class="hidden flex-col h-full">
            <!-- Progress Bar -->
            <div class="w-full bg-[#f8edeb] h-3">
                <div id="progress-bar" class="progress-fill h-3 w-0 rounded-r-full"></div>
            </div>
            
            <div class="p-6 sm:p-10">
                <div class="flex justify-between items-center mb-8">
                    <span id="question-counter" class="text-sm font-bold text-[#b5ead7] bg-[#f0f9f6] py-1.5 px-4 rounded-full border-2 border-[#b5ead7]">
                        第 1 題 / 共 30 題
                    </span>
                    <span id="score-display" class="text-sm font-bold text-[#ffb7b2] bg-[#fff0f5] py-1.5 px-4 rounded-full border-2 border-[#ffb7b2]">
                        得分: 0
                    </span>
                </div>

                <!-- Question Text -->
                <h2 id="question-text" class="text-xl sm:text-2xl font-bold text-[#5c5470] mb-8 leading-relaxed">
                    <!-- 題目將顯示於此 -->
                </h2>

                <!-- Options -->
                <div id="options-container" class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-8">
                    <!-- 選項將顯示於此 -->
                </div>

                <!-- Explanation Area (Hidden by default) -->
                <div id="explanation-area" class="hidden">
                    <div class="explanation-box p-6 mb-8 shadow-sm">
                        <h3 class="font-bold text-[#4a7c59] mb-3 flex items-center text-lg">
                            <span class="text-2xl mr-2">✨</span> 詳細解釋
                        </h3>
                        <p id="explanation-text" class="text-[#5c5470] leading-loose text-lg font-medium">
                            <!-- 解答將顯示於此 -->
                        </p>
                    </div>
                    <div class="text-center sm:text-right">
                        <button id="next-btn" onclick="nextQuestion()" class="macaron-btn-alt font-bold py-3 px-10 rounded-full text-lg tracking-wide">
                            下一題 ➔
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Result Screen -->
        <div id="result-screen" class="hidden p-10 text-center flex flex-col items-center justify-center min-h-[450px]">
            <div class="text-7xl mb-6 bounce-animation">🎉</div>
            <h2 class="text-3xl font-bold text-[#6d6875] mb-2">測驗完成！</h2>
            <p class="text-[#8d8799] mb-8 font-medium">辛苦了！一起來看看最終成績吧 🌸</p>
            
            <div class="bg-[#fff9f9] border-4 border-[#ffdac1] rounded-3xl p-8 mb-8 w-full max-w-sm shadow-sm relative overflow-hidden">
                <div class="absolute -top-4 -right-4 text-6xl opacity-20">🍬</div>
                <div class="text-md text-[#ffb7b2] font-bold mb-2">最終得分</div>
                <div class="text-6xl font-bold text-[#ff9aa2] mb-2 drop-shadow-sm">
                    <span id="final-score">0</span><span class="text-3xl text-[#ffdac1]">/30</span>
                </div>
                <p id="result-message" class="text-[#5c5470] font-bold mt-4 text-lg"></p>
            </div>

            <button onclick="restartQuiz()" class="macaron-btn font-bold py-3 px-10 rounded-full text-lg tracking-widest">
                重新測驗
            </button>
        </div>
    </div>

    <!-- Message Box Overlay -->
    <div id="message-box" class="fixed inset-0 bg-[#5c5470] bg-opacity-40 flex items-center justify-center z-50 hidden opacity-0 transition-opacity duration-300 backdrop-blur-sm">
        <div class="bg-white rounded-3xl shadow-2xl p-8 max-w-sm w-full mx-4 transform scale-95 transition-transform duration-300 border-4 border-[#ffdac1]" id="message-content-box">
            <h3 class="text-xl font-bold text-[#ff9aa2] mb-3 flex items-center">
                <span class="mr-2">🎀</span> 提示
            </h3>
            <p class="text-[#6d6875] mb-8 font-medium text-lg" id="message-body">這是一則訊息。</p>
            <div class="text-center">
                <button onclick="closeMessage()" class="macaron-btn font-bold py-2.5 px-8 rounded-full">
                    確定
                </button>
            </div>
        </div>
    </div>

    <script>
        // Quiz Data - Perfectly balanced: A=8, B=8, C=7, D=7
        // A(0)=8, B(1)=8, C(2)=7, D(3)=7
        const quizData = [

                options: ["A. ので", "B. のに", "C. でも", "D. なら"],

                exp: "表示原因、理由的「〜ので」。<br>（<ruby>今日<rt>きょう</rt></ruby>は<ruby>用事<rt>ようじ</rt></ruby>があるから、<ruby>先<rt>さき</rt></ruby>に<ruby>帰<rt>かえ</rt></ruby>ります）"

            { // 4. Answer: D (3)

                exp: "表示推測的「〜ようです」，前面接普通形。<br>（<ruby>田中<rt>たなか</rt></ruby>さんは<ruby>今日<rt>きょう</rt></ruby>は<ruby>来<rt>こ</rt></ruby>ないようです）"
            },
            { // 5. Answer: A (0)

                correct: 0,
                exp: "「<ruby>入<rt>はい</rt></ruby>るな」是禁止形，意思是「不要進去」。相當於「<ruby>入<rt>はい</rt></ruby>らないでください」。"
            },
            { // 6. Answer: B (1)

                correct: 1,
                exp: "對家人或同事說「<ruby>行<rt>い</rt></ruby>ってきます」（我出門了）時，要回「<ruby>行<rt>い</rt></ruby>ってらっしゃい」（慢走）。"
            },

                q: "この服が合うかどうか、一度（　　）。",

                exp: "傳聞的「〜そうです」前面接普通形。<br>（<ruby>天気予報<rt>てんきよほう</rt></ruby>によると、<ruby>明日<rt>あした</rt></ruby>は<ruby>雨<rt>あめ</rt></ruby>が<ruby>降<rt>ふ</rt></ruby>るそうです）"

            { // 15. Answer: C (2)

                options: ["A. 明日は必ず仕事をします。", "B. 明日は休みではないと思います。", "C. 明日は休みだと強く思っています。", "D. 明日は休みになる予定がありません。"],
                correct: 2,
                exp: "「はず」表示說話者基於客觀事實的強烈確信。<br>（<ruby>明日<rt>あした</rt></ruby>は<ruby>休<rt>やす</rt></ruby>みだと<ruby>強<rt>つよ</rt></ruby>く<ruby>思<rt>おも</rt></ruby>っています）"

                correct: 3,

                correct: 1,
                exp: "我向老師借書，動作主體是自己。「<ruby>借<rt>か</rt></ruby>りる」的謙讓語是「お<ruby>借<rt>か</rt></ruby>りする」。"

                options: ["A. 帰って", "B. 帰らせて", "C. 帰られて", "D. 帰らせられて"],
                correct: 1,
                exp: "請求對方允許自己做某事時，用「動詞使役形＋てください」。<br>（<ruby>早<rt>はや</rt></ruby>く<ruby>帰<rt>かえ</rt></ruby>らせてください：請讓我回去）"
            },
            { // 27. Answer: C (2)
                q: "先生に（1 早く　2 帰らせて　3 ください　4 とお願いしました）。正しい順番はどれですか。",
                options: ["A. 2→1→3→4", "B. 1→3→2→4", "C. 1→2→3→4", "D. 3→2→1→4"],
                correct: 2,
                exp: "完整句型：「<ruby>先生<rt>せんせい</rt></ruby>に <ruby>早<rt>はや</rt></ruby>く <ruby>帰<rt>かえ</rt></ruby>らせて ください とお<ruby>願<rt>ねが</rt></ruby>いしました」（拜託老師讓我早點回去）。"
            },
            { // 28. Answer: D (3)
                q: "学生は先生に作文を（　　）。",
                options: ["A. 書かせました", "B. 書かれました", "C. 書いていました", "D. 書かされました"],
                correct: 3,
                exp: "使役被動語態，表示在別人的要求下被迫做某事。<br>（<ruby>学生<rt>がくせい</rt></ruby>は<ruby>先生<rt>せんせい</rt></ruby>に<ruby>作文<rt>さくぶん</rt></ruby>を<ruby>書<rt>か</rt></ruby>かされました：學生被老師要求寫作文）"
            },
            { // 29. Answer: A (0)
                q: "先生は学生に「毎日漢字を100個書いてください」と言いました。<br>学生は先生に何をさせられましたか。",
                options: ["A. 漢字を書かされました。", "B. 日本語を話させられました。", "C. 作文を書かされました。", "D. 本を読まされました。"],
                correct: 0,
                exp: "學生被老師要求每天寫100個漢字，所以是「被強迫寫漢字」。<br>（<ruby>漢字<rt>かんじ</rt></ruby>を<ruby>書<rt>か</rt></ruby>かされました）"
            },
            { // 30. Answer: B (1)
            q: "「雨が降ったので、試合は中止になりました。」一番近い意味はどれですか。",
            options: ["A. 雨が降っても、試合をします。", "B. 雨が降ったから、試合をやめました。", "C. 試合が中止になったのに、雨が降りました。", "D. 雨が降る前に、試合が終わりました。"],
            correct: 1,
            exp: "「ので」表示客觀原因。「因為下雨，比賽中止了」，意義等同於「<ruby>雨<rt>あめ</rt></ruby>が<ruby>降<rt>ふ</rt></ruby>ったから、<ruby>試合<rt>しあい</rt></ruby>をやめました」。"
        }
    ];

    let currentQuestionIndex = 0;
    let score = 0;
    let answered = false;

    function startQuiz() {
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('quiz-screen').classList.remove('hidden');
        document.getElementById('quiz-screen').classList.add('flex');
        currentQuestionIndex = 0;
        score = 0;
        updateScore();
        loadQuestion();
    }

    function loadQuestion() {
        answered = false;
        const qData = quizData[currentQuestionIndex];
        
        // Update Progress & UI (No English text)
        document.getElementById('question-counter').innerText = `第 ${currentQuestionIndex + 1} 題 / 共 ${quizData.length} 題`;
        const progressPercentage = ((currentQuestionIndex) / quizData.length) * 100;
        document.getElementById('progress-bar').style.width = `${progressPercentage}%`;
        
        // Set Question Text
        document.getElementById('question-text').innerHTML = qData.q;
        
        // Generate Options
        const optionsContainer = document.getElementById('options-container');
        optionsContainer.innerHTML = '';
        
        qData.options.forEach((opt, index) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn w-full text-left p-4 sm:p-5 font-bold text-[#6d6875] text-lg bg-white';
            btn.innerHTML = opt;
            btn.onclick = () => selectOption(index, btn);
            optionsContainer.appendChild(btn);
        });

        // Hide explanation
        document.getElementById('explanation-area').classList.add('hidden');
    }

    function selectOption(selectedIndex, btnElement) {
        if (answered) return;
        answered = true;

        const qData = quizData[currentQuestionIndex];
        const isCorrect = (selectedIndex === qData.correct);
        const allBtns = document.querySelectorAll('.option-btn');
        
        // Disable all buttons
        allBtns.forEach(btn => {
            btn.disabled = true;
            btn.classList.add('cursor-default', 'opacity-70');
        });

        // Highlight chosen & correct
        if (isCorrect) {
            btnElement.classList.add('correct');
            score++;
            updateScore();
        } else {
            btnElement.classList.add('wrong');
            allBtns[qData.correct].classList.add('correct'); // Show correct answer
        }

        // Show explanation
        const expArea = document.getElementById('explanation-area');
        const expText = document.getElementById('explanation-text');
        expText.innerHTML = qData.exp;
        expArea.classList.remove('hidden');
        
        // Scroll to explanation smoothly if on mobile
        setTimeout(() => {
            expArea.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }, 100);
    }

    function updateScore() {
        document.getElementById('score-display').innerText = `得分: ${score}`;
    }

    function nextQuestion() {
        if (currentQuestionIndex < quizData.length - 1) {
            currentQuestionIndex++;
            loadQuestion();
        } else {
            showResult();
        }
    }

    function showResult() {
        document.getElementById('quiz-screen').classList.add('hidden');
        document.getElementById('quiz-screen').classList.remove('flex');
        document.getElementById('result-screen').classList.remove('hidden');
        document.getElementById('result-screen').classList.add('flex');
        
        document.getElementById('progress-bar').style.width = `100%`;
        document.getElementById('final-score').innerText = score;
        
        const msgElement = document.getElementById('result-message');
        if (score === 30) {
            msgElement.innerText = "太厲害了！完美滿分，N4 對你來說小菜一碟！🥇";
        } else if (score >= 24) {
            msgElement.innerText = "非常優秀！N4 基礎非常紮實！🌟";
        } else if (score >= 18) {
            msgElement.innerText = "表現不錯，再複習一下不熟的文法就更完美了！💪";
        } else {
            msgElement.innerText = "沒關係，多加練習一定會進步的！加油！📚";
        }
    }

    function restartQuiz() {
        document.getElementById('result-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.remove('flex');
        startQuiz();
    }

    function showMessage(title, body) {
        const msgBox = document.getElementById('message-box');
        const contentBox = document.getElementById('message-content-box');
        document.getElementById('message-title').innerHTML = `<span class="mr-2">🎀</span> ${title}`;
        document.getElementById('message-body').innerText = body;
        
        msgBox.classList.remove('hidden');
        // Small delay for transition
        setTimeout(() => {
            msgBox.classList.remove('opacity-0');
            contentBox.classList.remove('scale-95');
        }, 10);
    }

    function closeMessage() {
        const msgBox = document.getElementById('message-box');
        const contentBox = document.getElementById('message-content-box');
        
        msgBox.classList.add('opacity-0');
        contentBox.classList.add('scale-95');
        
        setTimeout(() => {
            msgBox.classList.add('hidden');
        }, 300);
    }
</script>
